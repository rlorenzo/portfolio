# Site settings
title: Rex Lorenzo
email: rexlorenzo@gmail.com
description: >-
  Rex Lorenzo, software engineer and engineering leader. I build production software, and lead the teams that ship it. Twenty years in.
baseurl: ""
url: "https://portfolio.rexlorenzo.com"


# Build settings
markdown: kramdown
plugins:
  - jekyll-seo-tag

# Collections
collections:
  sections:
    output: false

# Exclude from processing.
# Anything not listed here is copied into _site verbatim and published, so this
# list is the boundary between the site and the repo that builds it. Dotfiles
# are excluded by Jekyll automatically and need no entry.
exclude:
  # Dependencies and lockfiles
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - package.json
  - package-lock.json
  # Tooling config
  - playwright.config.js
  - rolldown.config.mjs
  - oxlintrc.json
  - lint.cks
  # Source and build helpers
  - scripts/
  # Tests: ~16MB of committed baseline screenshots, none of it site content
  - tests/
  - playwright-report/
  # Repo documentation, not pages
  - README.md
  - CLAUDE.md
  - AGENTS.md
  - DESIGN.md
  - PRODUCT.md
  - LICENSE