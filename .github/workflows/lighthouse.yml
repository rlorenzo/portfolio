name: Lighthouse CI

on:
  push:
    branches: [ main ]
  # No base-branch filter: `pull_request.branches` matches the PR's base, so
  # filtering on main silently skips CI for any PR stacked on another branch.
  pull_request:

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        device: [mobile, desktop]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Ruby
        uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073 # v1.324.0
        with:
          ruby-version: '3.3.6'
          bundler-cache: true

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci
        env:
          HUSKY: 0

      - name: Build CSS
        run: npm run build:css

      - name: Build JavaScript
        run: npm run build:js

      - name: Build Jekyll site
        run: JEKYLL_ENV=production bundle exec jekyll build --baseurl ""

      # One step, because a background process does not reliably outlive the
      # step that starts it: `npx serve &` returned immediately and the runner
      # tore down the server before it ever bound the port. `--no-install`
      # forces both npx calls to use the devDependencies from `npm ci`
      # instead of fetching from the registry; the timeout covers server
      # startup and port availability.
      - name: Serve site and wait for it
        run: |
          npx --no-install serve _site -p 4000 &
          npx --no-install wait-on http://localhost:4000 --timeout 120000

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # 12.6.2
        with:
          configPath: .lighthouserc.${{ matrix.device }}.json
          uploadArtifacts: true
          artifactName: lighthouse-results-${{ matrix.device }}

      - name: Print Lighthouse scores
        if: always()
        run: |
          node -e "
            const fs = require('fs');
            const dir = '.lighthouseci';
            const file = fs.readdirSync(dir).find(f => f.endsWith('.json') && f.startsWith('lhr'));
            if (!file) { console.log('No report found'); process.exit(0); }
            const { categories } = JSON.parse(fs.readFileSync(dir + '/' + file));
            console.log('\nLighthouse scores:');
            Object.values(categories).forEach(c =>
              console.log('  ' + c.title.padEnd(16) + Math.round(c.score * 100))
            );
          "
